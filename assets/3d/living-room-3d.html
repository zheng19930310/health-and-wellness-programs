<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9e5df">
<title>极简客厅 · 3D 效果图</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#e9e5df;position:fixed;inset:0;width:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:#22201d}
  /* canvas 必须由 CSS 明确定尺寸：setSize(w,h,false) 不写 style，
     而 canvas 是替换元素，width:auto 会回退到内在尺寸(=视口×DPR)，导致画面被放大偏移 */
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .hud{position:fixed;left:0;right:0;display:flex;gap:8px;padding:12px 14px;z-index:5;pointer-events:none}
  .hud.top{top:0;align-items:flex-start;justify-content:space-between;
    background:linear-gradient(180deg,rgba(238,234,228,.92),rgba(238,234,228,0))}
  .hud.bot{bottom:0;flex-direction:column;padding-bottom:calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(238,234,228,.94),rgba(238,234,228,0))}

  .title{font-size:15px;font-weight:650;letter-spacing:.3px;line-height:1.35}
  .title small{display:block;font-size:11px;font-weight:400;opacity:.6;letter-spacing:.4px}
  .btns{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto;justify-content:flex-end;max-width:66%}
  .btn{border:1px solid rgba(34,32,29,.16);background:rgba(255,255,255,.7);backdrop-filter:blur(8px);
    border-radius:999px;padding:7px 12px;font-size:12px;line-height:1;cursor:pointer;white-space:nowrap;
    transition:.18s;font-family:inherit;color:#22201d}
  .btn:active{transform:scale(.96)}
  .btn.on{background:#22201d;color:#f3efe9;border-color:#22201d}
  @media (max-width:430px){ .btn{padding:6px 9px;font-size:11px} .title{font-size:13px} }

  #chips{display:flex;gap:7px;overflow-x:auto;pointer-events:auto;padding:2px 0 8px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid rgba(34,32,29,.14);background:rgba(255,255,255,.62);
    border-radius:999px;padding:6px 11px;font-size:11.5px;cursor:pointer;white-space:nowrap;transition:.18s}
  .chip.on{background:#22201d;color:#f3efe9;border-color:#22201d}

  #card{position:fixed;left:14px;bottom:calc(64px + env(safe-area-inset-bottom));max-width:270px;z-index:6;
    background:rgba(252,251,249,.9);backdrop-filter:blur(14px);border:1px solid rgba(34,32,29,.1);
    border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(40,34,26,.14);
    opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:.24s cubic-bezier(.2,.8,.3,1)}
  #card.show{opacity:1;transform:none;pointer-events:auto}
  #card .k{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;opacity:.45}
  #card .n{font-size:17px;font-weight:660;margin:3px 0 5px}
  #card .d{font-size:12px;line-height:1.6;opacity:.72}
  #card .row{display:flex;gap:6px;margin-top:9px}
  #card .mini{border:1px solid rgba(34,32,29,.16);border-radius:8px;padding:5px 9px;font-size:11px;
    background:transparent;cursor:pointer;font-family:inherit;color:#22201d}
  #card .act{font-size:11px;letter-spacing:.4px;margin-top:8px;min-height:14px;color:#4b7a45;opacity:0;
    transition:opacity .25s}
  #card .act.show{opacity:1}

  #dot{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;z-index:4;
    background:#2f6bff;box-shadow:0 0 0 4px rgba(47,107,255,.22);opacity:0;transition:opacity .2s;pointer-events:none}
  #dot.show{opacity:1;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(47,107,255,.22)}50%{box-shadow:0 0 0 9px rgba(47,107,255,.08)}}

  #tip{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);
    font-size:11.5px;opacity:.5;z-index:5;pointer-events:none;max-width:86vw;text-align:center;line-height:1.5;
    transition:opacity .5s}

  #load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#e9e5df;transition:opacity .6s}
  #load.gone{opacity:0;pointer-events:none}
  #load .l{text-align:center}
  #load .b{width:150px;height:2px;background:rgba(34,32,29,.12);border-radius:2px;overflow:hidden;margin:12px auto 0}
  #load .b i{display:block;height:100%;width:35%;background:#22201d;border-radius:2px;animation:slide 1.1s infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(430%)}}
  #load p{font-size:12px;letter-spacing:2px;opacity:.55}

  /* 书本操作条：书抽出后浮现在画面下方 */
  #book{position:fixed;left:50%;bottom:calc(58px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
    z-index:7;display:flex;flex-direction:column;align-items:center;gap:7px;opacity:0;pointer-events:none;
    transition:.26s cubic-bezier(.2,.8,.3,1)}
  #book.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #book .bar{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:999px;
    background:rgba(252,251,249,.92);backdrop-filter:blur(14px);border:1px solid rgba(34,32,29,.1);
    box-shadow:0 8px 24px rgba(40,34,26,.16)}
  #book .tt{font-size:12px;font-weight:660;padding:0 4px;max-width:34vw;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  #book .at{font-size:10.5px;opacity:.5;padding-right:2px}
  #book .b{border:1px solid rgba(34,32,29,.16);border-radius:999px;background:rgba(255,255,255,.6);
    padding:6px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;color:#22201d;white-space:nowrap}
  #book .b:active{transform:scale(.96)}
  #book .b.hi{background:#22201d;color:#f3efe9;border-color:#22201d}
  #bkPick{display:none;flex-direction:column;gap:6px;padding:9px 11px;border-radius:14px;
    background:rgba(252,251,249,.94);backdrop-filter:blur(14px);border:1px solid rgba(34,32,29,.1);
    box-shadow:0 10px 28px rgba(40,34,26,.18);max-width:88vw}
  #bkPick.show{display:flex}
  #bkPick .lb{font-size:10px;letter-spacing:.8px;opacity:.5;text-transform:uppercase}
  #bkPick .grp{display:flex;flex-wrap:wrap;gap:5px}
  #bkPick .bk{border:1px solid rgba(34,32,29,.16);border-radius:8px;background:rgba(255,255,255,.7);
    min-width:30px;padding:5px 7px;font-size:11.5px;cursor:pointer;font-family:inherit;color:#22201d}
  #bkPick .bk.on{background:#22201d;color:#f3efe9;border-color:#22201d}
  #bkPick .hint{font-size:11px;opacity:.62;line-height:1.5}
  #bkPick .row{display:flex;gap:6px;justify-content:flex-end;margin-top:2px}
  #bkPick .mini{border:1px solid rgba(34,32,29,.16);border-radius:8px;padding:5px 10px;font-size:11.5px;
    background:rgba(255,255,255,.7);cursor:pointer;font-family:inherit;color:#22201d}
  #bkPick .mini.go{background:#22201d;color:#f3efe9;border-color:#22201d}
  @media (max-width:420px){#card{left:10px;right:10px;max-width:none}
    #book .tt{max-width:26vw}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud top">
  <div class="title">极简暖调客厅 · 3D 方案<small id="sub">WARM MINIMAL LIVING ROOM — 全屋俯瞰</small></div>
  <div class="btns">
    <button class="btn" id="bDay">日光</button>
    <button class="btn" id="bSpin">自转</button>
    <button class="btn" id="bReset">复位</button>
  </div>
</div>

<div id="dot"></div>

<div id="card">
  <div class="k" id="cardK">SELECTED</div>
  <div class="n" id="cardN">—</div>
  <div class="d" id="cardD">—</div>
  <div class="row">
    <button class="mini" id="cardFocus">聚焦此物</button>
    <button class="mini" id="cardClose">关闭</button>
  </div>
  <div class="act" id="cardAct"></div>
</div>

<!-- 书本操作条：抽出某本书后出现 -->
<div id="book">
  <div id="bkPick">
    <div class="lb">插到第几层</div>
    <div class="grp" id="bkRows"></div>
    <div class="lb">该层第几个位置</div>
    <div class="grp" id="bkSlots"></div>
    <div class="hint" id="bkHint"></div>
    <div class="row"><button class="mini" id="bkNo">取消</button><button class="mini go" id="bkGo">插回这里</button></div>
  </div>
  <div class="bar">
    <span class="tt" id="bkTitle">—</span><span class="at" id="bkAt"></span>
    <button class="b hi" id="bkOpen">展开书本</button>
    <button class="b" id="bkBack">放回书架</button>
    <button class="b" id="bkMove">更换书本位置</button>
  </div>
</div>

<div class="hud bot">
  <div id="chips"></div>
</div>
<div id="tip">单指拖拽平移 · 双指捏合缩放 · 双指拖动旋转 · 点击进入房间/家具 · 双击灯/电视可开关</div>

<div id="load"><div class="l"><p>BUILDING SCENE</p><div class="b"><i></i></div></div></div>
