<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>康养项目综合管理平台 · 高保真前端原型</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script>
if(!window.echarts){document.write('<script src="https://unpkg.com/echarts@5.5.1/dist/echarts.min.js"><\/script>');}
</script>
<style>
:root{
  --blue:#1668dc; --blue-d:#0d4bb3; --blue-dd:#0a3572; --blue-l:#e9f2ff;
  --ink:#0a1524; --ink-2:#102437; --ink-3:#1b3350; --ink-4:#25415f;
  --green:#00b578; --green-d:#029a67; --green-l:#e6f7ef; --cyan:#22d3c5;
  --bg:#f2f5fa; --card:#fff; --line:#e3e9f2; --line-d:#25415f;
  --txt:#1b2b3d; --sub:#6b7c93; --sub-l:#98a8bd;
  --warn:#f5a623; --danger:#e5484d; --purple:#7c5cff;
  --r:12px; --sh:0 1px 2px rgba(16,42,67,.05),0 6px 20px rgba(16,42,67,.07);
  --sh-lg:0 12px 40px rgba(10,30,60,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 "PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue);text-decoration:none}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,h4{margin:0;font-weight:700}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c7d2e0;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#a9b8cb}
::-webkit-scrollbar-track{background:transparent}

/* ============ views ============ */
.view{display:none;height:100vh;width:100vw;overflow:hidden}
.view.on{display:block}
.view.flex-c{display:none}
.view.on.flex-c{display:flex}

/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--txt);font-size:13px;transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue);box-shadow:0 2px 8px rgba(22,104,220,.12)}
.btn.p{background:linear-gradient(135deg,var(--blue),var(--blue-d));border-color:transparent;color:#fff}
.btn.p:hover{filter:brightness(1.08);color:#fff;box-shadow:0 4px 14px rgba(22,104,220,.35)}
.btn.g{background:linear-gradient(135deg,var(--green),var(--green-d));border-color:transparent;color:#fff}
.btn.g:hover{filter:brightness(1.06);color:#fff;box-shadow:0 4px 14px rgba(0,181,120,.3)}
.btn.dg{color:var(--danger)}
.btn.dg:hover{border-color:var(--danger);color:var(--danger);box-shadow:0 2px 8px rgba(229,72,77,.15)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:6px}
.btn.lg{height:44px;padding:0 22px;font-size:15px;border-radius:10px}
.btn.blk{width:100%;justify-content:center}
.btn.gho{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{color:var(--blue);cursor:pointer;font-size:13px}
.link:hover{text-decoration:underline}
.link.dg{color:var(--danger)}

/* ============ form ============ */
.field{margin-bottom:16px}
.field>label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.field>label i{color:var(--danger);font-style:normal;margin-right:2px}
.inp,.sel,.txta{width:100%;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe;outline:none;transition:.18s;font-size:13px}
.txta{height:auto;padding:8px 12px;resize:vertical;min-height:76px;line-height:1.6}
.sel{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%236b7c93' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:28px}
.inp:focus,.sel:focus,.txta:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(22,104,220,.1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.err{color:var(--danger);font-size:12px;margin-top:4px;display:none}

/* ============ tags / badges ============ */
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;background:#eef2f7;color:var(--sub);white-space:nowrap}
.tag.blue{background:var(--blue-l);color:var(--blue-d)}
.tag.green{background:var(--green-l);color:var(--green-d)}
.tag.warn{background:#fff5e5;color:#c97f0b}
.tag.red{background:#fdecec;color:#d2373c}
.tag.purple{background:#f0ecff;color:#5b3fd6}
.tag.ink{background:#e5eaf1;color:#334a63}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(0,181,120,.15)}
.dot.off{background:#c3cbd6}
.dot.al{background:var(--danger);box-shadow:0 0 0 3px rgba(229,72,77,.15);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ============ LOGIN ============ */
#v-login{background:#071527 center/cover no-repeat;position:relative}
#v-login .bg{position:absolute;inset:0;background-size:cover;background-position:center 40%;filter:saturate(1.05)}
#v-login .mask{position:absolute;inset:0;background:
  linear-gradient(105deg,rgba(6,20,38,.92) 0%,rgba(8,32,58,.72) 38%,rgba(6,40,45,.35) 62%,rgba(4,30,26,.55) 100%)}
#v-login .wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(28px,7vw,110px);gap:40px}
.lg-brand{color:#fff;max-width:560px;animation:up .7s ease both}
.lg-brand .logo{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.lg-brand .logo .mk{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 24px rgba(0,181,120,.35)}
.lg-brand .logo b{font-size:21px;letter-spacing:1px}
.lg-brand .logo span{display:block;font-size:12px;color:rgba(255,255,255,.65);letter-spacing:3px;font-weight:400}
.lg-brand h1{font-size:clamp(28px,3.4vw,44px);line-height:1.25;font-weight:800;letter-spacing:1px}
.lg-brand h1 em{font-style:normal;background:linear-gradient(90deg,#5ce0b0,#4aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-brand p{margin:16px 0 26px;color:rgba(255,255,255,.78);font-size:15px;line-height:1.9}
.lg-feat{display:flex;flex-wrap:wrap;gap:10px}
.lg-feat i{font-style:normal;font-size:12.5px;color:rgba(255,255,255,.85);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:6px 12px;border-radius:20px;backdrop-filter:blur(6px)}
.lg-card{width:392px;flex:0 0 392px;background:rgba(255,255,255,.97);border-radius:18px;padding:32px 32px 26px;box-shadow:0 30px 70px rgba(0,10,30,.45);animation:up .7s .1s ease both;position:relative}
.lg-card h2{font-size:21px;margin-bottom:4px}
.lg-card .sub{color:var(--sub);font-size:13px;margin-bottom:22px}
.lg-tabs{display:flex;background:#f2f5fa;border-radius:9px;padding:4px;margin-bottom:20px}
.lg-tabs button{flex:1;height:32px;border-radius:7px;font-size:13px;color:var(--sub)}
.lg-tabs button.on{background:#fff;color:var(--blue);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.lg-row{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 18px;font-size:13px;color:var(--sub)}
.lg-foot{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);text-align:center;color:var(--sub-l);font-size:12px;line-height:1.9}
.lg-acc-btn{display:inline-flex;align-items:center;gap:6px;color:var(--green-d);background:var(--green-l);border:1px solid #bfe9d6;border-radius:20px;padding:5px 14px;font-size:12.5px;margin-bottom:14px}
.lg-acc-btn:hover{background:#d5f2e6}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media (max-width:1080px){.lg-brand{display:none}#v-login .wrap{justify-content:center}}

/* ============ account modal ============ */
.acc-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:52vh;overflow:auto;padding:2px}
.acc{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fbfcfe;cursor:pointer;transition:.16s;position:relative}
.acc:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(22,104,220,.12);transform:translateY(-1px)}
.acc b{font-size:13.5px;display:flex;align-items:center;gap:6px}
.acc .rl{font-size:11px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--green));padding:1px 7px;border-radius:9px;font-weight:400}
.acc .un{font-size:12px;color:var(--sub);margin-top:5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.acc .pv{position:absolute;right:11px;top:11px;font-size:11px;color:var(--sub-l)}
.acc .ends{margin-top:6px;font-size:11px;color:var(--sub-l)}

/* ============ modal ============ */
.mask2{position:fixed;inset:0;background:rgba(8,20,36,.5);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:900;padding:20px}
.mask2.on{display:flex;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:14px;width:640px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--sh-lg);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal.hdr{width:920px}
/* ============ 全屏 3D 视图查看器 ============ */
.v3d-mask{position:fixed;inset:0;z-index:1200;background:#050b12;display:none;flex-direction:column}
.v3d-mask.on{display:flex;animation:fade .18s}
.v3d-bar{flex:0 0 auto;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(90deg,#0a2a4a,#0b3a3a);border-bottom:1px solid rgba(74,168,255,.3)}
.v3d-bar b{font-size:15px;letter-spacing:1px;color:#eafcff}
.v3d-acts{display:flex;align-items:center;gap:16px}
.v3d-acts a{color:#8ecbff;font-size:12.5px;text-decoration:none}
.v3d-acts a:hover{text-decoration:underline}
.v3d-mask iframe{flex:1;width:100%;height:100%;border:0;background:#000}
.m-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-h h3{font-size:16px}
.m-h .x{width:30px;height:30px;border-radius:8px;color:var(--sub);font-size:18px;line-height:1}
.m-h .x:hover{background:#f2f5fa;color:var(--danger)}
.m-b{padding:20px;overflow:auto;flex:1}
.m-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fafbfd;border-radius:0 0 14px 14px}

/* ============ HOME / portal ============ */
#v-home{overflow:auto;background:radial-gradient(1200px 600px at 12% -10%,#123a6b 0%,transparent 60%),radial-gradient(1000px 500px at 95% 0%,#0b5f4a 0%,transparent 55%),linear-gradient(180deg,#0a1524,#0d1c2f 60%,#0a1524)}
.hm-top{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,4vw,54px);color:#fff}
.hm-top .logo{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:1px}
.hm-top .logo .mk{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center;font-size:20px}
.hm-top .logo small{display:block;font-size:11px;color:rgba(255,255,255,.55);letter-spacing:2px;font-weight:400}
.hm-user{display:flex;align-items:center;gap:14px;font-size:13px}
.hm-user .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#4aa8ff,#5ce0b0);display:flex;align-items:center;justify-content:center;font-weight:700;color:#062033}
.hm-hero{padding:26px clamp(20px,4vw,54px) 8px;color:#fff}
.hm-hero h1{font-size:clamp(24px,3vw,34px);letter-spacing:1px}
.hm-hero h1 span{background:linear-gradient(90deg,#5ce0b0,#4aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hm-hero p{color:rgba(255,255,255,.62);margin:8px 0 0;max-width:760px;line-height:1.8}
.hm-kpi{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:24px clamp(20px,4vw,54px) 0}
.hm-kpi .k{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;color:#fff}
.hm-kpi .k b{font-size:22px;font-weight:800;letter-spacing:.5px}
.hm-kpi .k i{font-style:normal;font-size:12px;color:rgba(255,255,255,.55);display:block;margin-top:2px}
.hm-kpi .k u{text-decoration:none;font-size:11px;color:#5ce0b0}
.hm-ends{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:26px clamp(20px,4vw,54px)}
.end{position:relative;border-radius:16px;padding:24px;color:#fff;min-height:230px;display:flex;flex-direction:column;cursor:pointer;overflow:hidden;border:1px solid rgba(255,255,255,.12);transition:.25s}
.end:hover{transform:translateY(-6px);border-color:rgba(92,224,176,.6);box-shadow:0 22px 50px rgba(0,0,0,.4)}
.end .ico{font-size:30px;width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin-bottom:16px;border:1px solid rgba(255,255,255,.15)}
.end h3{font-size:18px;letter-spacing:.5px}
.end p{font-size:12.5px;color:rgba(255,255,255,.66);line-height:1.8;margin:8px 0 14px;flex:1}
.end .go{font-size:13px;color:#5ce0b0;font-weight:600}
.end .badge{position:absolute;top:18px;right:18px;font-size:11px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:2px 9px;border-radius:10px;color:rgba(255,255,255,.8)}
.end.e1{background:linear-gradient(150deg,#0f3f7d,#0a2547 60%,#0b1d33)}
.end.e2{background:linear-gradient(150deg,#0a5f52,#06304a 60%,#0b1d33)}
.end.e3{background:linear-gradient(150deg,#155a9c,#0d2f57 55%,#0a2038)}
.end.e4{background:linear-gradient(150deg,#116b4f,#0a3a52 60%,#0a2038)}
.hm-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;padding:0 clamp(20px,4vw,54px) 40px}
.hm-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:18px 20px;color:#fff}
.hm-box h4{font-size:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-weight:600}
.hm-box h4 span{font-size:11.5px;color:rgba(255,255,255,.5);font-weight:400}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.flow i{font-style:normal;background:rgba(74,168,255,.14);border:1px solid rgba(74,168,255,.3);color:#bfe0ff;padding:7px 12px;border-radius:9px}
.flow u{text-decoration:none;color:#5ce0b0}
.mini-list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.09);font-size:12.8px;color:rgba(255,255,255,.82)}
.mini-list li:last-child{border:0}
.mini-list li b{font-weight:600;color:#fff}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.role-grid div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:10px 12px;font-size:12px;color:rgba(255,255,255,.75)}
.role-grid div b{display:block;color:#fff;font-size:13px;margin-bottom:2px}
@media (max-width:1200px){.hm-ends{grid-template-columns:repeat(2,1fr)}.hm-kpi{grid-template-columns:repeat(3,1fr)}.hm-grid{grid-template-columns:1fr}}

/* ============ ADMIN shell ============ */
#v-admin{display:none}
#v-admin.on{display:flex}
.side{width:236px;flex:0 0 236px;background:linear-gradient(180deg,#0a1524,#0d1e33);color:rgba(255,255,255,.72);display:flex;flex-direction:column;transition:.2s;position:relative;z-index:20}
.side .s-logo{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;color:#fff;font-weight:700;border-bottom:1px solid rgba(255,255,255,.07);letter-spacing:.5px;flex:0 0 auto}
.side .s-logo .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.side .s-logo small{display:block;font-size:10px;color:rgba(255,255,255,.45);letter-spacing:2px;font-weight:400}
.nav{flex:1;overflow-y:auto;padding:10px 8px 20px}
.nav::-webkit-scrollbar{width:5px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14)}
.nav .grp{margin-top:12px;font-size:11px;color:rgba(255,255,255,.35);padding:6px 12px;letter-spacing:1.5px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.nav .grp:hover{color:rgba(255,255,255,.6)}
.nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;font-size:13.2px;color:rgba(255,255,255,.72);margin-bottom:2px;position:relative;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(22,104,220,.9),rgba(0,181,120,.55));color:#fff;box-shadow:0 4px 14px rgba(22,104,220,.35)}
.nav a .ic{width:18px;text-align:center;flex:0 0 18px;font-size:14px}
.nav a .cnt{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.14);border-radius:9px;padding:0 6px;line-height:17px;height:17px}
.nav a .cnt.red{background:var(--danger)}
.nav a.hide,.nav .grp.hide{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;flex:0 0 auto;position:relative;z-index:15}
.top .crumb{font-size:13px;color:var(--sub)}
.top .crumb b{color:var(--txt);font-weight:600}
.top .sp{flex:1}
.top .sw{position:relative}
.top .sw>button{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px;font-size:13px;background:#fbfcfe}
.top .sw>button:hover{border-color:var(--blue);color:var(--blue)}
.dd{position:absolute;right:0;top:42px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh-lg);padding:6px;min-width:220px;display:none;z-index:50}
.dd.on{display:block;animation:pop .16s}
.dd button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;font-size:13px;text-align:left}
.dd button:hover{background:var(--blue-l);color:var(--blue-d)}
.dd button small{margin-left:auto;color:var(--sub-l);font-size:11px}
.dd .sep{height:1px;background:var(--line);margin:5px 2px}
.icbtn{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:var(--sub);position:relative}
.icbtn:hover{background:#f2f5fa;color:var(--blue)}
.icbtn .bdg{position:absolute;top:2px;right:2px;min-width:15px;height:15px;background:var(--danger);color:#fff;border-radius:8px;font-size:10px;line-height:15px;text-align:center;padding:0 3px;font-weight:700}
.who{display:flex;align-items:center;gap:9px;font-size:13px;padding-left:6px}
.who .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.who small{display:block;color:var(--sub-l);font-size:11px}
.body{flex:1;overflow:auto;padding:20px 22px 40px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-h h2{font-size:19px;display:flex;align-items:center;gap:9px}
.page-h p{margin:5px 0 0;color:var(--sub);font-size:12.8px}
.page-h .acts{display:flex;gap:9px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card+.card{margin-top:16px}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;display:flex;align-items:center;gap:8px}
.card-h h3:before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--blue),var(--green))}
.card-b{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;right:-24px;top:-24px;width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,rgba(22,104,220,.09),rgba(0,181,120,.09))}
.kpi i{font-style:normal;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.kpi i .e{width:24px;height:24px;border-radius:7px;background:var(--blue-l);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.kpi b{display:block;font-size:25px;margin:7px 0 3px;letter-spacing:.5px;font-weight:800}
.kpi span{font-size:11.5px;color:var(--sub-l)}
.kpi span u{text-decoration:none;color:var(--green-d)}
.kpi span dn{text-decoration:none;color:var(--danger)}
@media (max-width:1400px){.kpis{grid-template-columns:repeat(2,1fr)}}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);background:#fbfcfe;border-radius:var(--r) var(--r) 0 0}
.filters .inp,.filters .sel{width:auto;min-width:150px;height:32px}
.filters .grow{flex:1}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{background:#f7f9fc;color:var(--sub);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
table.tb td{padding:11px 12px;border-bottom:1px solid #eff3f8;vertical-align:middle}
table.tb tbody tr:hover{background:#f6faff}
table.tb tbody tr.sel{background:#eef5ff}
table.tb .ops{white-space:nowrap}
table.tb .ops span+span{margin-left:10px}
table.tb .nm{display:flex;align-items:center;gap:9px}
table.tb .nm .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#dbe7f7,#d6f2e6);color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 auto}
table.tb .tt{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.tb .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--sub)}
.tbwrap{overflow-x:auto}
.empty{padding:52px 20px;text-align:center;color:var(--sub-l)}
.empty .e{font-size:38px;margin-bottom:8px}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 18px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.pager button{min-width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 8px;font-size:12.5px}
.pager button:hover{border-color:var(--blue);color:var(--blue)}
.pager button.on{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;border-color:transparent}
.pager button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);background:#fff;border-radius:var(--r) var(--r) 0 0;overflow-x:auto}
.tabs button{padding:12px 16px;font-size:13.5px;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-color:var(--blue);font-weight:600}
.tabs button:hover{color:var(--blue)}
.bar2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media (max-width:1250px){.bar2{grid-template-columns:1fr}}
.chart{width:100%;height:290px}
.chart.sm{height:220px}
.chart.lg{height:360px}
.lst{max-height:330px;overflow:auto}
.lst li{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:12.8px}
.lst li:last-child{border:0}
.lst li .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;background:var(--blue-l)}
.lst li .ic.g{background:var(--green-l)}
.lst li .ic.r{background:#fdecec}
.lst li .ic.w{background:#fff5e5}
.lst li b{font-weight:600}
.lst li p{margin:2px 0 0;color:var(--sub-l);font-size:12px}
.lst li .tm{margin-left:auto;color:var(--sub-l);font-size:11.5px;white-space:nowrap}
.dwrap{display:flex;gap:16px;align-items:flex-start}
.dside{width:210px;flex:0 0 210px}
.dmain{flex:1;min-width:0}
.dinfo{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
.dinfo div{font-size:13px}
.dinfo div label{display:block;color:var(--sub-l);font-size:11.5px;margin-bottom:2px}
.dinfo.full div{grid-column:1/-1}
.prog{height:6px;background:#eef2f7;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:4px}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--blue),var(--green))}
.tl li{position:relative;padding:0 0 14px 12px;font-size:12.8px}
.tl li:before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--blue)}
.tl li.g:before{border-color:var(--green)}
.tl li.r:before{border-color:var(--danger)}
.tl li label{display:block;color:var(--sub-l);font-size:11.5px}
.tl li b{font-weight:600}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1100px){.twin{grid-template-columns:1fr}}
.tiny{font-size:11.5px;color:var(--sub-l)}
.hl{background:linear-gradient(transparent 60%,#ffe9a8 0)}
.chk{width:15px;height:15px;cursor:pointer}
.sw-box{display:flex;flex-wrap:wrap;gap:12px}
.ck{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fbfcfe;min-width:190px;flex:1 1 200px}
.ck b{font-size:13px;display:flex;align-items:center;gap:7px}
.ck p{margin:5px 0 0;font-size:11.5px;color:var(--sub-l)}
.seg{display:inline-flex;background:#f2f5fa;border-radius:8px;padding:3px}
.seg button{padding:5px 13px;font-size:12.5px;border-radius:6px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--blue);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.park{position:relative;height:340px;border-radius:12px;overflow:hidden;background:radial-gradient(700px 300px at 30% 10%,#123a63,transparent),linear-gradient(160deg,#0a1c33,#0d2b3f 60%,#0a2130)}
.park svg{position:absolute;inset:0;width:100%;height:100%}
.pmark{position:absolute;transform:translate(-50%,-50%);cursor:pointer}
.pmark i{display:block;width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(0,181,120,.25)}
.pmark.al i{background:var(--danger);box-shadow:0 0 0 4px rgba(229,72,77,.28);animation:pulse 1.2s infinite}
.pmark.b i{background:#4aa8ff;box-shadow:0 0 0 4px rgba(74,168,255,.22)}
.pmark label{position:absolute;left:16px;top:-6px;font-size:11px;color:rgba(255,255,255,.85);white-space:nowrap;background:rgba(6,20,36,.6);padding:1px 7px;border-radius:8px;border:1px solid rgba(255,255,255,.12)}
.zone{position:absolute;border:1px dashed rgba(255,255,255,.22);border-radius:12px;background:rgba(255,255,255,.04);padding:8px 10px;color:rgba(255,255,255,.8);font-size:11.5px;letter-spacing:1px}
.zone b{display:block;font-size:12.5px;color:#5ce0b0}
.legend{position:absolute;right:12px;bottom:12px;background:rgba(6,20,36,.72);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:9px 12px;font-size:11.5px;color:rgba(255,255,255,.8)}
.legend div{display:flex;align-items:center;gap:7px;margin-top:4px}
.legend div:first-child{margin-top:0}
.legend em{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ============ BIG SCREEN ============ */
#v-screen{background:#04101f;color:#dff0ff;overflow:hidden}
#v-screen.on{display:block}
.sc{height:100vh;display:flex;flex-direction:column;padding:0 16px 12px;background:
 radial-gradient(1100px 420px at 50% -8%,rgba(22,104,220,.35),transparent 60%),
 radial-gradient(900px 400px at 8% 100%,rgba(0,181,120,.18),transparent 60%),
 radial-gradient(900px 400px at 100% 90%,rgba(22,104,220,.16),transparent 60%)}
.sc-h{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;flex:0 0 auto;position:relative}
.sc-h:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,rgba(74,168,255,.7),rgba(92,224,176,.9),rgba(74,168,255,.7),transparent)}
.sc-h .t{text-align:center;flex:1}
.sc-h .t h1{font-size:26px;letter-spacing:5px;background:linear-gradient(180deg,#fff,#8fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px rgba(74,168,255,.35)}
.sc-h .t p{margin:2px 0 0;font-size:11.5px;letter-spacing:4px;color:rgba(159,212,255,.6)}
.sc-h .l,.sc-h .r{width:300px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:#9fd4ff}
.sc-h .r{justify-content:flex-end}
.sc-btn{border:1px solid rgba(74,168,255,.35);background:rgba(22,104,220,.14);color:#bfe0ff;border-radius:8px;padding:5px 12px;font-size:12px}
.sc-btn:hover{background:rgba(22,104,220,.3);border-color:#4aa8ff}
.sc-btn.g{border-color:rgba(92,224,176,.4);background:rgba(0,181,120,.14);color:#c6f5e4}
.sc-body{flex:1;display:grid;grid-template-columns:340px 1fr 340px;gap:14px;padding-top:14px;min-height:0}
.sc-col{display:flex;flex-direction:column;gap:14px;min-height:0}
.pnl{background:linear-gradient(180deg,rgba(12,36,66,.82),rgba(8,24,44,.82));border:1px solid rgba(74,168,255,.2);border-radius:10px;padding:11px 13px;flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.pnl:before,.pnl:after{content:"";position:absolute;width:11px;height:11px;border-color:rgba(92,224,176,.85);border-style:solid}
.pnl:before{left:-1px;top:-1px;border-width:2px 0 0 2px;border-radius:10px 0 0 0}
.pnl:after{right:-1px;bottom:-1px;border-width:0 2px 2px 0;border-radius:0 0 10px 0}
.pnl h4{font-size:13px;color:#bfe0ff;display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:600;letter-spacing:1px;flex:0 0 auto}
.pnl h4:before{content:"";width:3px;height:12px;background:linear-gradient(180deg,#4aa8ff,#5ce0b0);border-radius:2px}
.pnl h4 span{margin-left:auto;font-size:11px;color:rgba(159,212,255,.55);font-weight:400;letter-spacing:0}
.pnl .ch{flex:1;min-height:0;width:100%}
.sc-center{display:flex;flex-direction:column;gap:14px;min-height:0}
.sc-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;flex:0 0 auto}
.sc-kpi div{background:linear-gradient(180deg,rgba(12,40,72,.85),rgba(8,24,44,.7));border:1px solid rgba(74,168,255,.22);border-radius:10px;padding:10px 12px;text-align:center}
.sc-kpi b{display:block;font-size:23px;font-weight:800;background:linear-gradient(180deg,#fff,#5ce0b0);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:"DIN Alternate",ui-monospace,monospace}
.sc-kpi i{font-style:normal;font-size:11.5px;color:rgba(191,224,255,.7);letter-spacing:1px}
.sc-map{flex:1;min-height:0;position:relative}
.sc-bot{height:120px;flex:0 0 120px}
.warnlist{overflow:auto;flex:1;min-height:0}
.warnlist li{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:12px;margin-bottom:6px;background:rgba(229,72,77,.09);border-left:2px solid rgba(229,72,77,.7)}
.warnlist li.w{background:rgba(245,166,35,.09);border-color:rgba(245,166,35,.75)}
.warnlist li.g{background:rgba(0,181,120,.1);border-color:rgba(0,181,120,.8)}
.warnlist li b{color:#fff;font-weight:600}
.warnlist li p{margin:1px 0 0;color:rgba(191,224,255,.66);font-size:11px}
.warnlist li .tm{margin-left:auto;font-size:10.5px;color:rgba(159,212,255,.55);white-space:nowrap}
.rank li{display:flex;align-items:center;gap:9px;font-size:12px;padding:6px 0;color:rgba(191,224,255,.85)}
.rank li .n{width:18px;height:18px;border-radius:5px;background:rgba(74,168,255,.2);color:#bfe0ff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rank li:nth-child(1) .n{background:linear-gradient(135deg,#ffb347,#ff8a00);color:#3a2000}
.rank li:nth-child(2) .n{background:linear-gradient(135deg,#cfe3ff,#9db8d8);color:#1a2b40}
.rank li:nth-child(3) .n{background:linear-gradient(135deg,#f0b27a,#c9773f);color:#3a1c00}
.rank li .b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li em{font-style:normal;color:#5ce0b0;font-family:ui-monospace,monospace}
.marquee{height:34px;flex:0 0 34px;border:1px solid rgba(74,168,255,.2);border-radius:8px;display:flex;align-items:center;overflow:hidden;background:rgba(8,24,44,.7)}
.marquee .lb{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;height:100%;display:flex;align-items:center;padding:0 12px;font-size:12px;letter-spacing:1px;flex:0 0 auto}
.marquee .tk{flex:1;overflow:hidden;white-space:nowrap;font-size:12.5px;color:#bfe0ff}
.marquee .tk span{display:inline-block;padding-left:100%;animation:mv 26s linear infinite}
@keyframes mv{to{transform:translateX(-100%)}}
.twin2{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}

/* ============ MOBILE (APP / 小程序) ============ */
.mb{height:100%;overflow:auto;display:flex;align-items:safe center;justify-content:safe center;gap:38px;padding:20px;background:
 radial-gradient(900px 500px at 15% 0%,rgba(22,104,220,.35),transparent 60%),
 radial-gradient(800px 460px at 90% 100%,rgba(0,181,120,.28),transparent 60%),linear-gradient(160deg,#0a1524,#0d1f33)}
.mb-side{width:300px;color:#fff;flex:0 0 300px}
.mb-side h2{font-size:22px;letter-spacing:1px}
.mb-side p{color:rgba(255,255,255,.62);font-size:13px;line-height:1.9;margin:10px 0 18px}
.mb-side .seg{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.mb-side .seg button{color:rgba(255,255,255,.65)}
.mb-side .seg button.on{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;box-shadow:0 4px 14px rgba(0,181,120,.35)}
.mb-side .f{margin-top:20px;display:flex;flex-direction:column;gap:9px;font-size:12.5px;color:rgba(255,255,255,.7)}
.mb-side .f i{font-style:normal;display:flex;gap:9px;align-items:center}
.mb-side .back{margin-top:24px}
.phone{width:392px;height:min(812px, calc(100vh - 44px));flex:0 0 auto;margin:auto;border-radius:44px;background:#05080f;padding:12px;box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08),inset 0 0 0 2px #1b2836;position:relative}
.phone:before{content:"";position:absolute;left:50%;top:12px;transform:translateX(-50%);width:118px;height:26px;background:#05080f;border-radius:0 0 16px 16px;z-index:9}
.scr{height:100%;width:100%;border-radius:33px;overflow:hidden;background:#f4f7fb;display:flex;flex-direction:column;position:relative}
.st{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px;font-size:12px;font-weight:600;color:#0b1220;background:transparent;position:relative;z-index:8}
.st .rt{display:flex;gap:5px;align-items:center;font-size:11px}
.app-hd{flex:0 0 auto;padding:2px 16px 12px;color:#fff;background:linear-gradient(160deg,#0f4c96,#127a63 90%);position:relative;overflow:hidden}
.app-hd:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.app-hd .row{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2}
.app-hd h3{font-size:17px;letter-spacing:.5px}
.app-hd .sm{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.app-hd .av{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;border:1.5px solid rgba(255,255,255,.4)}
.app-body{flex:1;overflow-y:auto;padding:14px 14px 16px;position:relative;z-index:2}
.app-body::-webkit-scrollbar{width:0}
.tabb{flex:0 0 auto;position:relative;z-index:5;height:62px;background:#fff;border-top:1px solid #e9eef5;display:flex;padding-bottom:12px}
.tabb button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#8b9aad}
.tabb button .e{font-size:19px}
.tabb button.on{color:var(--blue);font-weight:600}
.tabb button.sos{color:#fff}
.tabb button.sos .e{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff6b6b,#e5484d);display:flex;align-items:center;justify-content:center;margin-top:-24px;box-shadow:0 6px 18px rgba(229,72,77,.45);border:3px solid #fff}
.mc{background:#fff;border-radius:14px;padding:13px 14px;box-shadow:0 2px 10px rgba(16,42,67,.06);margin-bottom:12px}
.mc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mc-h b{font-size:14px}
.mc-h span{font-size:11.5px;color:var(--sub-l)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mgrid div{text-align:center;font-size:11.5px;color:var(--sub);padding:2px 0}
.mgrid div .e{width:46px;height:46px;margin:0 auto 6px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;background:linear-gradient(135deg,var(--blue-l),var(--green-l))}
.mgrid div.on .e{background:linear-gradient(135deg,var(--blue),var(--green));box-shadow:0 6px 16px rgba(22,104,220,.3)}
.hcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hcards div{border-radius:12px;padding:11px;color:#fff;position:relative;overflow:hidden}
.hcards div b{font-size:20px;display:block;font-weight:800}
.hcards div i{font-style:normal;font-size:11px;opacity:.85}
.hcards div label{font-size:11.5px;opacity:.9;display:block;margin-bottom:3px}
.hc1{background:linear-gradient(135deg,#1668dc,#2f8ef0)}
.hc2{background:linear-gradient(135deg,#00b578,#22c79a)}
.hc3{background:linear-gradient(135deg,#0d4bb3,#0a8f78)}
.mlist li{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #f0f3f8;font-size:13px}
.mlist li:last-child{border:0}
.mlist li .ic{width:36px;height:36px;border-radius:11px;background:var(--blue-l);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.mlist li .ic.g{background:var(--green-l)}
.mlist li .ic.w{background:#fff5e5}
.mlist li .ic.r{background:#fdecec}
.mlist li .tx{flex:1;min-width:0}
.mlist li .tx b{font-weight:600;font-size:13.2px;display:block}
.mlist li .tx p{margin:2px 0 0;color:var(--sub-l);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist li .rt{text-align:right;font-size:11px;color:var(--sub-l);white-space:nowrap}
.mchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.mchips::-webkit-scrollbar{height:0}
.mchips button{flex:0 0 auto;padding:6px 13px;border-radius:16px;background:#fff;font-size:12.5px;color:var(--sub);border:1px solid #e9eef5}
.mchips button.on{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(22,104,220,.28)}
.mcard2{border-radius:14px;padding:13px;margin-bottom:12px;background:linear-gradient(135deg,#0f4c96,#127a63);color:#fff;position:relative;overflow:hidden}
.mcard2 b{font-size:15px}
.mcard2 p{margin:5px 0 0;font-size:12px;color:rgba(255,255,255,.8)}
